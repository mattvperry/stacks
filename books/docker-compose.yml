name: unifi

services:
  autocaliweb:
    image: gelbphoenix/autocaliweb:v0.12.13@sha256:b180083a86d796c1ccf45fad5b2c4bb7f636911452377a55fcb57d1461652d8a
    container_name: autocaliweb
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1001
    volumes:
      - autocaliweb_config:/config
      - bookdrop:/acw-book-ingest
      - /media/trinity/books:/calibre-library
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    container_name: audiobookshelf
    environment:
      - TZ=America/New_York
    volumes:
      - /media/trinity/audiobooks:/audiobooks
      - abs_config:/config
      - abs_metadata:/metadata
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.7.2@sha256:c7d2e085e1828334653bee22fbcb2a8728bb2e2503a5c7d72601966c79510629
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1001
      - HIDE_LOCAL_AUTH=true
      - DISABLE_LOCAL_AUTH=true
      - OIDC_AUTO_REDIRECT=true
    volumes:
      - bookdrop:/bookdrop
      - shelfmark_config:/config
      - /media/trinity/audiobooks:/audiobooks
      - /media/trinity/.usenet/complete/books:/data/.usenet/complete/books
      - /media/trinity/.torrents/complete:/data/.torrents/complete
    networks:
      - default
      - media_default
    restart: unless-stopped

volumes:
  autocaliweb_config:
  abs_config:
  abs_metadata:
  shelfmark_config:
  bookdrop:

networks:
  default:
  media_default:
    external: true
