name: unifi

services:
  autocaliweb:
    image: gelbphoenix/autocaliweb:v0.12.13@sha256:b180083a86d796c1ccf45fad5b2c4bb7f636911452377a55fcb57d1461652d8a
    container_name: autocaliweb
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1001
    volumes:
      - autocaliweb_config:/config
      - bookdrop:/acw-book-ingest
      - /media/trinity/books:/calibre-library
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
    container_name: audiobookshelf
    environment:
      - TZ=America/New_York
    volumes:
      - /media/trinity/audiobooks:/audiobooks
      - abs_config:/config
      - abs_metadata:/metadata
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.5.1@sha256:acfa46b8be80f1e2f084a7703ff027ab274397feb24006114e92c05c140b62c3
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1001
      - HIDE_LOCAL_AUTH=true
      - DISABLE_LOCAL_AUTH=true
      - OIDC_AUTO_REDIRECT=true
    volumes:
      - bookdrop:/bookdrop
      - shelfmark_config:/config
      - /media/trinity/audiobooks:/audiobooks
      - /media/trinity/.usenet/complete/books:/data/.usenet/complete/books
      - /media/trinity/.torrents/complete:/data/.torrents/complete
    networks:
      - default
      - media_default
    restart: unless-stopped

volumes:
  autocaliweb_config:
  abs_config:
  abs_metadata:
  shelfmark_config:
  bookdrop:

networks:
  default:
  media_default:
    external: true
