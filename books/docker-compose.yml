name: unifi

services:
  autocaliweb:
    image: gelbphoenix/autocaliweb:v0.12.12@sha256:b895a1685b59f3661aa70f3bb20f4051a95401c392661b97b03ed0917bf260db
    container_name: autocaliweb
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1001
    volumes:
      - autocaliweb_config:/config
      - bookdrop:/acw-book-ingest
      - /media/trinity/books:/calibre-library
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
    container_name: audiobookshelf
    environment:
      - TZ=America/New_York
    volumes:
      - /media/trinity/audiobooks:/audiobooks
      - abs_config:/config
      - abs_metadata:/metadata
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1001
      - HIDE_LOCAL_AUTH=true
      - DISABLE_LOCAL_AUTH=true
      - OIDC_AUTO_REDIRECT=true
    volumes:
      - bookdrop:/bookdrop
      - shelfmark_config:/config
      - /media/trinity/audiobooks:/audiobooks
      - /media/trinity/.usenet/complete/books:/data/.usenet/complete/books
      - /media/trinity/.torrents/complete:/data/.torrents/complete
    networks:
      - default
      - media_default
    restart: unless-stopped

volumes:
  autocaliweb_config:
  abs_config:
  abs_metadata:
  shelfmark_config:
  bookdrop:

networks:
  default:
  media_default:
    external: true
