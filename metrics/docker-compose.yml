name: metrics

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command: --store_container_labels=false
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true

  ##
  # Dashboard and query interface
  ##
  grafana:
    image: docker.io/grafana/grafana:13.1@sha256:599fc11cf9e71f326f12b7626de3e878c9e40d366dcfb56cb65725a153efab80
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SERVER_ROOT_URL=https://logs.mattvperry.com
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=${GF_VL_PLUGIN};victorialogs-datasource,${GF_VM_PLUGIN};victoriametrics-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=victorialogs-datasource,victoriametrics-datasource
    restart: unless-stopped
    labels:
      - homepage.group=System
      - homepage.name=Grafana
      - homepage.icon=grafana
      - homepage.href=https://logs.mattvperry.com
      - homepage.description=Dashboards and Monitoring
  node_exporter:
    image: docker.io/prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    container_name: node_exporter
    volumes:
      - /:/host:ro,rslave
    network_mode: host
    command:
      - --web.listen-address=172.17.0.1:9100
      - --path.rootfs=/host
    restart: unless-stopped
    pid: host

  ##
  # Collection aggregation
  ##
  vector:
    image: docker.io/timberio/vector:0.62.0-alpine@sha256:149c77c09aabf16a3aa543abf9cea2e2152c1d9a7d4a45669fe7ad05f4ed8b27
    container_name: vector
    depends_on:
      victorialogs:
        condition: service_started
      victoriametrics:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  ##
  # Log aggregation
  ##
  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.55.0@sha256:7bec543b83cbff641e4b568c6f28d8e9cd779e4eab3add9f8806c32af23ea1e1
    container_name: victorialogs
    volumes:
      - victorialogs_data:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -loggerFormat=json
    restart: unless-stopped

  ##
  # Metric aggregation
  ##
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.157.0@sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20
    container_name: victoriametrics
    volumes:
      - victoriametrics_data:/vmsingle
      - ./config/scrape.yaml:/promscrape.yaml
    command:
      - -storageDataPath=/vmsingle
      - -promscrape.config=/promscrape.yaml
      - -loggerFormat=json
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://victoriametrics:8428/health" ]
      interval: 1s
      timeout: 1s
      retries: 10

volumes:
  victorialogs_data:
  victoriametrics_data:
  grafana_data:
