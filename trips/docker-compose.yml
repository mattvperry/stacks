name: trips

services:
  trek:
    image: mauriceboe/trek:4.1.0@sha256:a651a2c67694262bf8692113e1681e8a93ec1d376d88ba47d48648a7ffd96679
    container_name: trek
    environment:
      - APP_URL=https://trips.mattvperry.com
      - OIDC_ONLY=true
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  data:
  uploads:
